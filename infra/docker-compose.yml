services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: englong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/englong
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
